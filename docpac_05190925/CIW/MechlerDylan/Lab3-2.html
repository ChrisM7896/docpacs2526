<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<title>Lab 3-2</title>
</head>

<body>
	<h3>CIW JavaScript Specialist</h3>
	<hr>
	<form id="myForm">
		<button type="button" id="argButton">Call Function with Arguments</button><br>
		<button type="button" id="returnButton">Call Function with Return</button>
	</form>

	<script>
		// Function that takes an argument 
		function myFunction(arg) {
			alert("The function has been called with an argument: " + arg);
		}


		// Function that returns a value 
		function myFunction1() {
			return "Hi, this value is returned from a function.";
		}


		// Add event listeners to buttons 
		document.getElementById('argButton').addEventListener('click', () => {
			myFunction("Welcome!");
		});

		document.getElementById('returnButton').addEventListener('click', () => {
			alert(myFunction1());
		});
	</script>
</body>

</html>
