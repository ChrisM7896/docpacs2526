<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Lab 11-5</title>
		<style>
			button { margin: 5px; padding: 10px; }
			#output { margin-top: 20px; border-top: 1px solid #ccc; padding-top: 10px; }
		</style>

    </head>
	
	<body>
	<h2>CIW JavaScript Specialist</h2>
	<hr>
		<h3>Web Developer Ethics & Privacy Lab</h3>

		<p>Click a topic below to learn more and reflect:</p>

		<button id="ethicsBtn">Ethical Behavior for Web Professionals</button>
		<button id="privacyBtn">Privacy Considerations</button>
		<button id="fairUseBtn">Fair Use Guidelines</button>
		<button id="lawsBtn">Relevant Laws</button>
		<button id="intellectualBtn">Intellectual Property</button>
		<div id="output"></div>

		<script>
		const output = document.getElementById('output');

		const topics = {
			ethics: "A set of ways for you to behave ethically in your work on the internet.",
			privacy: "The right for individuals to control their personal information online.",
			fairUse: "The ability to use copyrighted material under certain conditions without permission.",
			laws: "A system of rules created and enforced through social or governmental institutions.",
			intellectual: "The legal rights that result from intellectual activity in industrial, scientific, literary, and artistic fields."
		};

		document.getElementById('ethicsBtn').addEventListener('click', () => {
			output.innerHTML = `<h3>Ethical Behavior</h3><p>${topics.ethics}</p>`;
		});

		document.getElementById('privacyBtn').addEventListener('click', () => {
			output.innerHTML = `<h3>Privacy Considerations</h3><p>${topics.privacy}</p>`;
		});

		document.getElementById('fairUseBtn').addEventListener('click', () => {
			output.innerHTML = `<h3>Fair Use Guidelines</h3><p>${topics.fairUse}</p>`;
		});

		document.getElementById('lawsBtn').addEventListener('click', () => {
			output.innerHTML = `<h3>Relevant Laws</h3><p>${topics.laws}</p>`;
		});


		</script>

	</body>
</html>
