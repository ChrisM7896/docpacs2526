<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
		<title>Lab 2-3</title>
	</head>

<body>
  <h3>CIW JavaScript Specialist</h3>
  <hr>
  <div id="output"></div>
  
  <script>
    // Declare variables using let and const
    let a = new Number(5);
    const b = "5";
    let c = new Number(10);
    // Get output container
    const output = document.getElementById("output");
    // Create output
    let html = `
      <p>Values of variables: <b> a = 5, b = "5", c = 10</p>
      <p>Value of <b> a == b: true</b></p>
      <p>Value of <b> a === b: false</b></p>
      <p>Value of <b> !== c: true</b></p>
      <p>Value of <b> a + b: 55</b></p>
    `;
    // Updates variable a using valueOf() to avoid object-to-object addition
    a = new Number(a.valueOf() + c.valueOf());
    // Displays output
    output.innerHTML = html;
  </script>
</body>

</html>
