<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Lesson 1 Application Project 2</title>

	</head>

	<body>
	<!-- Container for the output -->
		<div id="output"></div>

	  <script>
		// Declare two number variables
		let number1 = 10;
		let number2 = 5;

		// Create output string
		let output = "";
		output += "Addition: " + (number1 + number2) + "<br>";
		output += "Subtraction: " + (number1 - number2) + "<br>";
		output += "Multiplication: " + (number1 * number2) + "<br>";
		output += "Division: " + (number1 / number2) + "<br>";
		output += "Modulus: " + (number1 % number2) + "<br>";
		output += "Num1 == Num2: " + (number1 == number2) + "<br>";
		output += "Num1 != Num2: " + (number1 != number2) + "<br>";
		output += "Num1 > Num2: " + (number1 > number2) + "<br>";
		output += "Num1 < Num2: " + (number1 < number2) + "<br>";
		output += "Num1 >= Num2: " + (number1 >= number2) + "<br>";
		output += "Num1 <= Num2: " + (number1 <= number2) + "<br>";

		// Display the result in the div
		document.getElementById("output").innerHTML = output;
	  </script>

	</body>
</html>
