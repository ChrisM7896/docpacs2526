<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<title>Lesson 6 Application Project</title>
</head>

<body>
	<h2>CIW JavaScript Specialist</h2>
	<hr>
	<label for="imageSelector">Choose an image:</label>
	<select id="imageSelector">
		<option value="">--Select an image--</option>
		<option value="image_1.jpg">Image 1</option>
		<option value="image_2.jpg">Image 2</option>
	</select>

	<script>
		'use strict';
		
		let popupWindow = null;

		function clearPopupDocument(doc) {
			// Remove all children from <html> element
			while (doc.documentElement.firstChild) {
				doc.documentElement.removeChild(doc.documentElement.firstChild);
			}
		}

		function createAndAppend(tag, parent, options = {}) {
			const el = parent.ownerDocument.createElement(tag);
			if (options.text) el.textContent = options.text;
			if (options.html) el.innerHTML = options.html;
			if (options.attrs) {
				for (const [key, val] of Object.entries(options.attrs)) {
					el.setAttribute(key, val);
				}
			}
			if (options.style) {
				for (const [prop, val] of Object.entries(options.style)) {
					el.style[prop] = val;
				}
			}
			if (options.events) {
				for (const [evt, handler] of Object.entries(options.events)) {
					el.addEventListener(evt, handler);
				}
			}
			parent.appendChild(el);
			return el;
		}

		function buildPopupContent(doc, title, imageUrl) {
			clearPopupDocument(doc);

			// Create <html> structure: <head> + <body>
			const html = doc.documentElement;

			// HEAD
			const head = doc.createElement('head');
			html.appendChild(head);

			const meta = doc.createElement('meta');
			meta.setAttribute('charset', 'UTF-8');
			head.appendChild(meta);

			const titleEl = doc.createElement('title');
			titleEl.textContent = 'Lesson 6 Application Project';
			head.appendChild(titleEl);

			const style = doc.createElement('style');
			style.textContent = `
			body {
			margin: 0;
			font-family: Arial, sans-serif;
			height: 100vh;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			text-align: center;
			}
			img {
			width: 150px;
			height: 150px;
			object-fit: contain;
			border: 1px solid #ccc;
			}
			button {
			margin-top: 20px;
			padding: 10px 20px;
			font-size: 1rem;
			cursor: pointer;
			}
	`;
			head.appendChild(style);

			// BODY
			const body = doc.createElement('body');
			html.appendChild(body);

			createAndAppend('h3', body, { text: title });

			createAndAppend('img', body, { attrs: { src: imageUrl, alt: title } });

			createAndAppend('button', body, {
				text: 'Close Preview',
				events: {
					click: () => {
						if (popupWindow && !popupWindow.closed) {
							popupWindow.close();
						}
					}
				}
			});
		}

		function display_image() {
			const selector = document.getElementById('imageSelector');
			const selectedValue = selector.value;
			const selectedText = selector.options[selector.selectedIndex].text;

			// Do not open a popup if nothing selected
			if (!selectedValue) return;

			// Open or focus popup
			if (!popupWindow || popupWindow.closed) {
				popupWindow = window.open('', 'Image Preview',
					'width=400,height=400,resizable=yes,scrollbars=yes');
			} else {
				popupWindow.focus();
			}

			function buildAndShow() {
				const doc = popupWindow.document;
				// Construct absolute URL for image (base is current page)
				const imageUrl = new URL(selectedValue, window.location.href).href;
				buildPopupContent(doc, selectedText, imageUrl);
			}

			// Wait for popup to be ready; if already complete, call immediately
			if (popupWindow.document && popupWindow.document.readyState === 'complete') {
				buildAndShow();
			} else {
				popupWindow.onload = buildAndShow;
			}

			// reset dropdown
			selector.selectedIndex = 0;
		}

		// Attach the change listener once
		(function init() {
			const selector = document.getElementById('imageSelector');
			if (selector) {
				selector.addEventListener('change', display_image);
			}
		})();
		

	</script>

</body>

</html>
