<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatroom</title>
    <style>
        #nameDisplay {
            border: 1px solid rgb(0, 0, 0);
            padding: 5px;
            height: 69px;
            margin-bottom: -1px;
        }

        #main {
            display: flex;
            width: 100%;
            height: 779px;
            
        }

        #message {
            display:inline-block;
            width: 80%;
            text-align: center;
            height: 776px;
        }

        #display {
            border: 1px solid rgb(0, 0, 0);
            height: 95%;
            overflow: auto;
        }

        #send {
            height: 2%;
            margin-top: -1px;
            display: flex;
        }

        #users {
            border: 1px solid rgb(0, 0, 0);
            width: 20%;
            text-align: center;
            height: 778px;
            margin-left: -1px;
            overflow: auto;
        }

        #text {
            width: 1200px;
            height: 36px;
            overflow: auto;
        }

        #sendMessage {
            width: 315px;
            height: 42px;
            margin-left: -5px;
            margin-right: -12px;
        }
    </style>
</head>

<body>
    <div id="nameDisplay">
        <h2>Welcome, User</h2>
    </div>
    <div id="main">
        <div id="message">
            <div id="display">Message</div>
            <div id="send">
                <form>
                    <input type="text" id="text" name="text" placeholder="Type Message Here">
                    <input type="submit" id="sendMessage" value="Send">
                </form>
            </div>
        </div>
        <div id="users">Users</div>
    </div>
</body>

</html>
